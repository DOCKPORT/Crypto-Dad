<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Crypto Dad | Stream Starting Soon</title>
    <meta name="description"
        content="Official landing page for The Crypto Dad. Live Stream insights and market analysis.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=JetBrains+Mono:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body class="dark-mode">
    <div class="wave-bg-container">
        <svg class="waves" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
            viewBox="0 24 150 28" preserveAspectRatio="none" shape-rendering="auto">
            <defs>
                <path id="gentle-wave" d="M-160 44c30 0 58-18 88-18s58 18 88 18 58-18 88-18 58 18 88 18v44h-352z" />
            </defs>
            <g class="wave-parallax">
                <use xlink:href="#gentle-wave" x="48" y="0" fill="rgba(247, 147, 26, 0.035)" />
                <use xlink:href="#gentle-wave" x="48" y="3" fill="rgba(247, 147, 26, 0.07)" />
                <use xlink:href="#gentle-wave" x="48" y="5" fill="rgba(247, 147, 26, 0.025)" />
                <use xlink:href="#gentle-wave" x="48" y="7" fill="rgba(247, 147, 26, 0.09)" />
            </g>
        </svg>
    </div>
    <main class="centered-container">
        <h1 id="fullscreen-toggle" class="landing-title">The Crypto <span class="gradient-text">Dad</span></h1>
        <p id="status-tagline" class="landing-tagline">Stream is Starting</p>

        <div class="timer-wrapper">
            <div class="stream-time-wrapper">
                <div class="stream-time" id="stream-time-display">SAT 6:00 PM EST</div>
                <input type="datetime-local" id="datetime-picker" class="hidden-picker">
            </div>
            <div id="countdown" class="countdown-timer">
                T- 00:00:00
            </div>
        </div>

        <div class="ticker-bar">
            <div class="coin-item">
                <img src="../Assets/btc.png" alt="BTC" class="card-icon">
                <div class="card-info">
                    <h3>BTC</h3>
                    <div class="price-container">
                        <p id="price-BTC" class="live-price">---</p>
                        <p id="change-BTC" class="change-percent">---</p>
                    </div>
                </div>
            </div>
            <div class="coin-item">
                <img src="../Assets/eth.png" alt="ETH" class="card-icon">
                <div class="card-info">
                    <h3>ETH</h3>
                    <div class="price-container">
                        <p id="price-ETH" class="live-price">---</p>
                        <p id="change-ETH" class="change-percent">---</p>
                    </div>
                </div>
            </div>
            <div class="coin-item">
                <img src="../Assets/bnb.png" alt="BNB" class="card-icon">
                <div class="card-info">
                    <h3>BNB</h3>
                    <div class="price-container">
                        <p id="price-BNB" class="live-price">---</p>
                        <p id="change-BNB" class="change-percent">---</p>
                    </div>
                </div>
            </div>
            <div class="coin-item">
                <img src="../Assets/xrp.png" alt="XRP" class="card-icon">
                <div class="card-info">
                    <h3>XRP</h3>
                    <div class="price-container">
                        <p id="price-XRP" class="live-price">---</p>
                        <p id="change-XRP" class="change-percent">---</p>
                    </div>
                </div>
            </div>
            <div class="coin-item">
                <img src="../Assets/sol.png" alt="SOL" class="card-icon">
                <div class="card-info">
                    <h3>SOL</h3>
                    <div class="price-container">
                        <p id="price-SOL" class="live-price">---</p>
                        <p id="change-SOL" class="change-percent">---</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="social-footer">

        <div class="social-item">
            <svg class="social-icon" viewBox="0 0 24 24" fill="currentColor">
                <path d="M24 11.5c0-1.65-1.35-3-3-3-.96 0-1.86.48-2.42 1.24-1.64-1-3.75-1.64-6.07-1.72l1.24-3.5 3.32.74c.05 1.34 1.15 2.42 2.5 2.42 1.38 0 2.5-1.12 2.5-2.5 0-1.38-1.12-2.5-2.5-2.5-.95 0-1.78.53-2.19 1.3l-3.66-.82c-.17-.04-.34.05-.4.21l-1.44 4.02c-2.39.04-4.57.69-6.27 1.71C5.07 8.94 4.11 8.5 3.1 8.5c-1.65 0-3 1.35-3 3 0 1.22.77 2.28 1.86 2.76-.04.25-.06.5-.06.77 0 3.73 4.41 6.77 9.85 6.77 5.44 0 9.85-3.04 9.85-6.77 0-.27-.02-.52-.06-.77 1.09-.48 1.86-1.54 1.86-2.76zm-17.55 1.63c.96 0 1.74.78 1.74 1.74 0 .96-.78 1.74-1.74 1.74s-1.74-.78-1.74-1.74.78-1.74 1.74-1.74zm11.23 4.2c-1.33 1.33-3.63 1.4-5.46 1.4h-.44c-1.83 0-4.13-.07-5.46-1.4-.23-.23-.23-.61 0-.84.23-.23.61-.23.84 0 1 1 3.03 1.13 4.84 1.13h.44c1.81 0 3.84-.13 4.84-1.13.23-.23.61-.23.84 0 .23.23.23.61 0 .84zm-2.03-2.46c-.96 0-1.74-.78-1.74-1.74 0-.96.78-1.74 1.74-1.74s1.74.78 1.74 1.74-.78 1.74-1.74 1.74z" />

</body>
